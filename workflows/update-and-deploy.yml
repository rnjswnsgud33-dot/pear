name: Refresh Fear Data & Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    # Tuesday-Saturday 10:40 KST, after previous U.S. market close.
    - cron: "40 1 * * 2-6"
    # Monday-Friday 23:40 KST, checks delayed data publications.
    - cron: "40 14 * * 1-5"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download market data and calculate composite
        run: python scripts/update_data.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
